    <meta charset="UTF-8">

    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h1>FENERİUM</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Ana Sayfa</a></li>
                <li><a href="urunler.html">Ürünlerimiz</a></li>
                <li><a href="sepet.html">Sepetim</a></li>

    <main class="container">
        <p><a href="urunler.html" class="geri-don-link">← Ürünlere Dön</a></p>

        <div class="urun-detay">
            <div class="detay-resim">
                <img src="../img/cubuklu.jpg" alt="Ürün Görseli">
            </div>

            <div class="detay-bilgi">
                <h2>Ürün Yükleniyor...</h2>
                <p class="fiyat">0 TL</p>
                <p id="urun-aciklama">Lütfen bekleyiniz...</p>
                
                <label for="beden"><b>Beden Seçiniz:</b></label><br>
                <select id="beden" class="beden-secim">
                    <option value="s">S</option>
                    <option value="m">M</option>
                    <option value="l">L</option>
                    <option value="xl">XL</option>
                </select>
                
                <br><br>
                <button id="sepete-ekle-btn" class="buton">Sepete Ekle</button>
            </div>
        </div>
    </main>
